{{- range .Values.llms }}
{{- $modelVolume := .modelName | lower | replace "/" "-" | replace "." "-" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $modelVolume }}
  namespace: cyber-ai
spec:
  replicas: {{ .replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-{{ $modelVolume }}
  template:
    metadata:
      labels:
        app: vllm-{{ $modelVolume }}
    spec:
      runtimeClassName: nvidia
      nodeSelector: {{ $.Values.nodeSelector | toJson }}
      tolerations: {{ $.Values.tolerations | toJson }}

      imagePullSecrets:
        - name: {{ $.Values.artifactory.ARTIFACTORY_SECRET }}
            
      nodeSelector:
        {{- toYaml (default $.Values.nodeSelector .nodeSelector) | nindent 8 }}

      tolerations:
        {{- toYaml (default $.Values.tolerations .tolerations) | nindent 8 }}
    
      # Init model weights (python script using the hf sdk snapshot_download for reliable weight download)
      # TODO: add ignore_patterns in snapshot_download to prevent downloading duplicate weights?
      initContainers:
      - name: model-downloader
        image: "{{ .image.repository }}:{{ .image.tag }}"
        imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          MODELS=({{ range .hfRepos }}{{ . | quote }} {{ end }})
          
          for repo in "${MODELS[@]}"; do
            echo "Downloading and syncing model with Artifactory: $repo"
            
            until python3 -c "
          import os
          import sys

          # Force disable Xet and HF_TRANSFER BEFORE importing huggingface_hub
          os.environ['HF_HUB_DISABLE_XET'] = '1'
          os.environ['HF_HUB_ENABLE_HF_TRANSFER'] = '0'

          import logging
          import huggingface_hub
          from huggingface_hub import snapshot_download

          huggingface_hub.utils.logging.set_verbosity_info()
          logging.basicConfig(
              stream=sys.stdout, 
              level=logging.INFO, 
              format='%(asctime)s [%(levelname)s] %(message)s',
              force=True
          )

          repo_id = '$repo'
          print(f'Starting download stream for {repo_id}...', flush=True)

          try:
              snapshot_download(
                  repo_id=repo_id,
                  max_workers=2,
                  ignore_patterns=['consolidated.safetensors']
              )
              print(f'Successfully downloaded {repo_id}', flush=True)
          except Exception as e:
              print(f'Download failed/stalled for {repo_id}: {e}', file=sys.stderr, flush=True)
              sys.exit(1)
          "; do
              echo "Stream interrupted or stalled. Retrying download in 10 seconds..."
              sleep 10
            done
          done
          
          echo "All required models successfully synchronized to PVC!"
        env:
          # Some vars to match the artifactory api (does not support all the HF downloading methods)
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "0"
        - name: HF_HUB_ETAG_TIMEOUT
          value: "600"
        - name: HF_HUB_DOWNLOAD_TIMEOUT
          value: "300"
        - name: HF_ENDPOINT
          value: {{ $.Values.artifactory.HF_ENDPOINT | quote }}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.artifactory.HF_TOKEN | quote }} 
              key: "token"
        volumeMounts:
        - name: model-storage
          mountPath: /root/.cache/huggingface

      # Main vLLM Container
      containers:
      - name: vllm-gpu
        image: "{{ .image.repository }}:{{ .image.tag }}"
        imagePullPolicy: {{ .image.pullPolicy | default "IfNotPresent" }}
        command: {{ .command | default (list "vllm") | toJson }}
        args:
          {{- toYaml .args | nindent 10 }}

        resources:
          limits:
            nvidia.com/gpu: {{ .hardware.gpuLimit | quote }}
          requests:
            nvidia.com/gpu: {{ .hardware.gpuLimit | quote }}
            
        env:
        # Prevents vLLM from attempting any network calls to HF/Artifactory at startup (airgapped)
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: VLLM_ENGINE_ITERATION_TIMEOUT_S
          value: "600"
        - name: HF_HUB_DISABLE_XET
          value: "1"

        ports:
        {{- range .ports | default (list 8000) }}
        - containerPort: {{ . }}
        {{- end }}

        volumeMounts:
        - name: model-storage
          mountPath: /root/.cache/huggingface 
        - name: dshm
          mountPath: /dev/shm 

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: pvc-vllm-cache-{{ $modelVolume }}
      - name: dshm
        emptyDir:
          medium: Memory
---
{{- end }}