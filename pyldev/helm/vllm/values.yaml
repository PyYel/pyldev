# HARDWARE
storage:
  className: "csi-cinder-high-speed" # OVH storage name
  claimName: "vllm-model-cache"

nodeSelector:
  nodepool: "pool-cyber-gpu-2" # Target GPU node pool

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "gpu"
    effect: "NoExecute" # NoSchedule # GPU allocation to pods specifying this toleration flag


# SECRETS
artifactory:
  ARTIFACTORY_SECRET: "artifactory-cyber-secret"
  HF_TOKEN: "artifactory-hf-token"
  HF_ENDPOINT: "https://artifactory.henav34.eu/artifactory/api/huggingfaceml/cyber-hf-remote" # "https://huggingface.co"


# vLLM
llms:
  # GPU0: Agent Executor / SLM
  - modelName: "gpu-Ministral-3-8B-Reasoning"
    hfRepos:
    - "mistralai/Ministral-3-8B-Reasoning-2512"
    replicaCount: 1
    storageSize: "50Gi"
    image:
      repository: "artifactory.henav34.eu/cyber-docker/vllm/vllm-openai"
      tag: "v0.18.1"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 1
    args:
      - "serve"
      - "mistralai/Ministral-3-8B-Reasoning-2512"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--tensor-parallel-size"
      - "1"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "32768"
      - "--tokenizer_mode"
      - "mistral"
      - "--config_format"
      - "mistral"
      - "--load_format"
      - "mistral"
      - "--reasoning-parser"
      - "mistral"
      - "--tool-call-parser"
      - "mistral"
      - "--enable-auto-tool-choice"
      # - "--load-format"
      # - "safetensors"
      - "--host"
      - "0.0.0.0"

  # GPU1&2: Orchestrator / LLM
  - modelName: "gpu-Mistral-Small-24B-Instruct"
    hfRepos:
    - "mistralai/Mistral-Small-24B-Instruct-2501"
    replicaCount: 1
    storageSize: "120Gi"
    image:
      repository: "artifactory.henav34.eu/cyber-docker/vllm/vllm-openai"
      tag: "v0.18.1"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 2 # Distributed across 2 GPUs
    args:
      - "serve"
      - "mistralai/Mistral-Small-24B-Instruct-2501"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--tensor-parallel-size"
      - "2" # 32 attention heads divide evenly by 2
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "32768"
      - "--tokenizer_mode"
      - "mistral"
      - "--config_format"
      - "mistral"
      - "--load_format"
      - "mistral"
      - "--tool-call-parser"
      - "mistral"
      - "--enable-auto-tool-choice"
      - "--load-format"
      - "safetensors"
      - "--host"
      - "0.0.0.0"

