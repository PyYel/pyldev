# HARDWARE
storage:
  className: "csi-cinder-high-speed" # OVH storage name
  claimName: "vllm-model-cache"

nodeSelector:
  nodepool: "pool-cyber-gpu-2" # Target GPU node pool

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "gpu"
    # effect: "NoExecute" # NoSchedule # GPU allocation to pods specifying this toleration flag


# SECRETS
artifactory:
  ARTIFACTORY_SECRET: "artifactory-cyber-secret"
  HF_TOKEN: "artifactory-hf-token"
  HF_ENDPOINT: "https://huggingface.co"


# vLLM
llms:
  # GPU0: Agent Executor / SLM
  - modelName: "gpu-Ministral-3-8B-Reasoning"
    replicaCount: 1
    storageSize: "50Gi"
    image:
      repository: "vllm/vllm-openai"
      tag: "v0.18.1"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 1
    args:
      - "serve"
      - "mistralai/Ministral-3-8B-Reasoning-2512"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--tensor-parallel-size"
      - "1"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "32768"
      - "--tokenizer_mode"
      - "mistral"
      - "--config_format"
      - "mistral"
      - "--load_format"
      - "mistral"
      - "--tool-call-parser"
      - "mistral"
      - "--enable-auto-tool-choice"

  # GPU1&2: Orchestrator / LLM
  - modelName: "gpu-Mistral-Small-24B-Instruct"
    replicaCount: 1
    storageSize: "60Gi"
    image:
      repository: "vllm/vllm-openai"
      tag: "v0.18.1"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 2 # Distributed across 2 GPUs
    args:
      - "serve"
      - "mistralai/Mistral-Small-24B-Instruct-2501"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--tensor-parallel-size"
      - "2" # 32 attention heads divide evenly by 2
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "32768"
      - "--tokenizer_mode"
      - "mistral"
      - "--config_format"
      - "mistral"
      - "--load_format"
      - "mistral"
      - "--tool-call-parser"
      - "mistral"
      - "--enable-auto-tool-choice"

  # GPU1&2: Orchestrator / LLM 
  # - modelName: "gpu-Mistral-Small-4-119B-NVFP4"
  #   replicaCount: 1
  #   storageSize: "120Gi"
  #   image:
  #     repository: "vllm/vllm-openai"
  #     tag: "v0.18.1"
  #     pullPolicy: "IfNotPresent"
  #   hardware:
  #     gpuLimit: 3
  #   args:
  #     - "serve"
  #     - "mistralai/Mistral-Small-4-119B-2603-NVFP4"
  #     - "--port"
  #     - "8000"
  #     - "--gpu-memory-utilization"
  #     - "0.95"
  #     - "--tensor-parallel-size"
  #     - "3"
  #     - "--dtype"
  #     - "float16"
  #     - "--max-model-len"
  #     - "16384"
  #     - "--tokenizer_mode"
  #     - "mistral"
  #     - "--config_format"
  #     - "mistral"
  #     - "--load_format"
  #     - "mistral"
  #     - "--tool-call-parser"
  #     - "mistral"
  #     - "--enable-auto-tool-choice"

  # GPU3: Extra models (eg: Embedding + Vision/OCR )
  - modelName: "gpu-bge-and-ocr"
    replicaCount: 1
    storageSize: "30Gi"
    image:
      repository: "vllm/vllm-openai"
      tag: "v0.18.1"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 1
    ports:
      - 8000 # Embedding port
      - 8001 # OCR / Vision port
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "Starting Embedding model on port 8000..."
        vllm serve BAAI/bge-m3 \
          --port 8000 \
          --gpu-memory-utilization 0.20 \
          --dtype float16 &
        echo "Starting OCR/Vision model on port 8001..."
        vllm serve Qwen/Qwen2-VL-7B-Instruct \
          --port 8001 \
          --gpu-memory-utilization 0.60 \
          --dtype float16 \
          --max-model-len 8192 &
        wait -n

  # CPU Instruct Model (Qwen2.5 0.5B) (but should run on the gpu node as well)
  - modelName: "cpu-Qwen2.5-0.5B-Instruct"
    replicaCount: 1
    storageSize: "10Gi"
    image:
      repository: "vllm/vllm-openai-cpu"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 0
    args:
      - "serve"
      - "Qwen/Qwen2.5-0.5B-Instruct"
      - "--port"
      - "8000"
      # - "--served-model-name"
      # - "Qwen/Qwen2.5-0.5B-Instruct"

  # CPU Embedding Model (BGE-M3) (but should run on the gpu node as well)
  - modelName: "cpu-bge-m3"
    replicaCount: 1
    storageSize: "10Gi"
    image:
      repository: "vllm/vllm-openai-cpu"
      tag: "latest"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 0
    args:
      - "serve"
      - "BAAI/bge-m3"
      - "--port"
      - "8000"
      # - "--served-model-name"
      # - "BAAI/bge-m3"

  