  # GPU3: Extra models (eg: Embedding + Vision/OCR )
  - modelName: "gpu-bge-and-ocr"
    hfRepos:
    - "BAAI/bge-m3"
    - "Qwen/Qwen2-VL-7B-Instruct"
    replicaCount: 1
    storageSize: "30Gi"
    image:
      repository: "artifactory.henav34.eu/cyber-docker/vllm/vllm-openai"
      tag: "v0.18.1"
      pullPolicy: "IfNotPresent"
    hardware:
      gpuLimit: 1
    ports:
      - 8000 # Embedding port
      - 8001 # OCR / Vision port
    command: ["/bin/bash", "-c"]
    args:
      - |
        echo "Starting Embedding model on port 8000..."
        vllm serve BAAI/bge-m3 \
          --port 8000 \
          --gpu-memory-utilization 0.20 \
          --host 0.0.0.0 \
          --dtype float16 &
        echo "Starting OCR/Vision model on port 8001..."
        vllm serve Qwen/Qwen2-VL-7B-Instruct \
          --port 8001 \
          --gpu-memory-utilization 0.60 \
          --dtype float16 \
          --max-model-len 8192 \
          --host 0.0.0.0 \
          --load-format safetensors & 
        wait -n

